[project]
name = "nulis"
version = "0.1.0"
description = "The Nulis rig: library tasks, sandboxed rollouts, splits and baselines"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "msgspec>=0.18",
]

[project.scripts]
nulis = "nulis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.16,<0.17"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
